# Builds the installers and standalone binaries for macOS, Windows and Linux, uploads them to a
# GitHub release, and publishes the release once every build has succeeded.
#
# Start it by pushing a version tag (git tag v0.2.0 && git push origin v0.2.0), or from the
# Actions tab with "Run workflow", where you can choose to stop at a draft. The release is
# named after the version in src-tauri/tauri.conf.json. Files go to a draft first, so nobody
# sees a half-uploaded release; if any build fails, the draft stays unpublished and re-running
# the workflow fills it in.
#
# Nothing is cached between runs, so a cached dependency can't end up inside a release build.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release when the builds finish (untick to leave it as a draft)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the version numbers agree
        run: |
          app=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "tauri.conf.json $app, package.json $pkg, Cargo.toml $crate"
          if [ "$app" != "$pkg" ] || [ "$app" != "$crate" ]; then
            echo "::error::Set the same version in src-tauri/tauri.conf.json, package.json and src-tauri/Cargo.toml."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$app" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $app. Tag it v$app or change the version."
            exit 1
          fi

      - run: npm ci

      - name: Typecheck and build the interface
        run: npm run build

      - name: Test
        run: npm test

  release:
    name: Create draft release
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: |
            **Which file to download**

            | | Installer | Without installing |
            | --- | --- | --- |
            | **macOS** (Apple silicon and Intel) | `.dmg` | |
            | **Windows** | `-setup.exe`, or `.msi` for managed installs | `_windows_x64.exe` runs as is |
            | **Linux** | `.AppImage`, or `.deb` / `.rpm` for your distribution | `_linux_x64` binary |

            The standalone Windows `.exe` needs Microsoft Edge WebView2, which Windows 10 and 11 already have. The Linux binary needs WebKitGTK 4.1 installed (`libwebkit2gtk-4.1-0` on Ubuntu and Debian); run `chmod +x` on it after downloading.

            If macOS says it can't check the app for malware, open System Settings, go to Privacy & Security and choose Open Anyway. If Windows SmartScreen appears, choose More info, then Run anyway.
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Drafts have no git tag yet, so look through the release list rather than by tag.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft)\"" | head -n 1)

          if [ -z "$existing" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Invoice Generator $tag" \
              -f body="$BODY" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq .id)
            echo "Created draft release $tag"
          else
            read -r id draft <<< "$existing"
            if [ "$draft" != "true" ]; then
              echo "::error::$tag is already published. Raise the version to build a new release."
              exit 1
            fi
            echo "Reusing draft release $tag; its files will be replaced"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS installer
            runner: macos-latest
            # One app that runs natively on Apple silicon and Intel Macs.
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            binary: false
          - name: Windows installers
            runner: windows-latest
            args: ""
            rust-targets: ""
            binary: false
          - name: Linux packages
            # The oldest supported Ubuntu, so the packages run on older distributions too.
            runner: ubuntu-22.04
            args: ""
            rust-targets: ""
            binary: false
          # Standalone executables come from their own build without bundling, as tauri-action
          # advises: an installer build marks its executable with the installer type.
          # macOS has no standalone GUI executable; the .app inside the .dmg is the app.
          - name: Windows binary
            runner: windows-latest
            args: --no-bundle
            rust-targets: ""
            binary: true
          - name: Linux binary
            runner: ubuntu-22.04
            args: --no-bundle
            rust-targets: ""
            binary: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - run: npm ci

      # Signs and notarizes the macOS app when the Apple secrets are set in the repository
      # (Settings > Secrets and variables > Actions). Without them the app is ad-hoc signed,
      # and people approve it once in Privacy & Security. Tauri treats a variable that is set
      # but empty as present, so they are only passed on when they have a value.
      - name: Set up macOS signing
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARIZE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::notice::No Apple certificate is set, so the macOS app is ad-hoc signed."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<CERTIFICATE_END"
            echo "$CERTIFICATE"
            echo "CERTIFICATE_END"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            if [ -n "$SIGNING_IDENTITY" ]; then echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"; fi
            if [ -n "$NOTARIZE_ID" ]; then
              echo "APPLE_ID=$NOTARIZE_ID"
              echo "APPLE_PASSWORD=$NOTARIZE_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARIZE_TEAM"
            fi
          } >> "$GITHUB_ENV"

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}
          uploadPlainBinary: ${{ matrix.binary }}
          # Binaries get the version in their name, like the installers:
          # invoice-generator_0.2.0_windows_x64.exe. Installers keep Tauri's own names.
          releaseAssetNamePattern: ${{ matrix.binary && '[mainBinaryName]_[version]_[platform]_[arch][ext]' || '' }}
          # The app has no auto-updater, so skip the updater manifest.
          uploadUpdaterJson: false

  publish:
    name: Publish release
    # Runs only when the draft exists and every build above succeeded. A manual run with
    # "publish" unticked stops here and leaves the draft for you to check.
    needs: [release, build]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          # Publishing creates the git tag at the built commit if it doesn't exist yet.
          url=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest=true \
            --jq .html_url)
          echo "Published $TAG: $url"
          echo "Published [$TAG]($url)" >> "$GITHUB_STEP_SUMMARY"
